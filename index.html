<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private Brew</title>
  <link rel="icon" href="https://fav.farm/🫘" />
  <style>
    body { font-family: "Helvetica Neue", Helvetica, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #faf8f5; color: #333; }
    h1 { text-align: center; color: #5c4033; font-weight: bold; margin-bottom: 20px; }
    
    /* LOGIN SCREEN */
    #loginPage { position: fixed; top:0; left:0; width:100%; height:100%; background:#faf8f5; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 85%; max-width: 320px; text-align: center; }
    
    /* NAVIGATION */
    .nav-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
    .nav-btn { flex: 1; min-width: 80px; padding: 10px; background: #e0d4c8; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #5c4033; font-size: 14px; }
    .nav-btn.active-btn { background: #5c4033; color: white; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 85%; max-width: 400px; padding: 25px; border-radius: 15px; }

    /* GENERAL UI */
    .page { display: none; } .page.active { display: block; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select { display: block; width: 100%; margin: 10px 0; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; font-family: inherit; }
    button.action-btn { display: block; width: 100%; padding: 15px; background: #5c4033; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; font-family: inherit; }
    button.action-btn.alt { background: #8d6e63; }
    
    /* TIMER */
    .timer-container { background: #f9f6f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e0d4c8; text-align: center; }
    .phase-name { font-size: 18px; color: #e65100; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    .phase-timer { font-size: 60px; font-weight: bold; color: #3e2723; line-height: 1; }
    .total-timer { font-size: 14px; color: #888; margin-top: 10px; font-weight: bold; }

    /* FEED & TIMELINE */
    .timeline { border-left: 3px solid #e0d4c8; padding-left: 25px; margin-left: 15px; position: relative; }
    .timeline-item { position: relative; margin-bottom: 25px; }
    .timeline-item::before { content: ''; position: absolute; left: -34px; top: 0; width: 14px; height: 14px; background: #5c4033; border-radius: 50%; border: 3px solid #faf8f5; }
    .timeline-card, .feed-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .timeline-date { font-weight: bold; color: #8d6e63; font-size: 12px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; text-transform: uppercase; }
    .feed-title { font-weight: bold; font-size: 17px; color: #3e2723; margin-bottom: 5px; }
    .data-label { font-weight: bold; color: #8d6e63; font-size: 10px; text-transform: uppercase; margin-top: 8px; display: block; }
    .detail-text { font-size: 14px; color: #555; margin-bottom: 2px; }
    .status { text-align: center; margin-top: 10px; font-weight: bold; color: #5c4033; }
    .row { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <div id="loginPage">
    <div class="login-card">
      <h2 style="color:#5c4033;">Coffee Lab Login</h2>
      <input type="text" id="usernameInput" placeholder="User Name">
      <input type="password" id="passwordInput" placeholder="Secret Password">
      <button class="action-btn" onclick="checkLogin()">Enter</button>
      <p id="loginError" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
  </div>

  <div id="helpModal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin-top:0;">Guide ☕</h2>
      <p style="font-size:14px;">1. Add Beans in Pantry.<br>2. Set Brew Steps in Recipes.<br>3. Run Timer in Brew Station.<br>4. Log results to see your Feed.</p>
      <button class="action-btn" onclick="toggleHelp()">Got it!</button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <div style="display:flex; justify-content:center; align-items:center; position:relative; margin-bottom:20px;">
      <h1>My Private Brew</h1>
      <button onclick="toggleHelp()" style="position:absolute; right:0; background:#e0d4c8; border:none; border-radius:50%; width:25px; height:25px; cursor:pointer; font-weight:bold;">?</button>
    </div>

    <div class="nav-bar">
      <button id="btn-brewPage" class="nav-btn active-btn" onclick="switchPage('brewPage')">Brew</button>
      <button id="btn-feedPage" class="nav-btn" onclick="switchPage('feedPage')">Feed</button>
      <button id="btn-recipePage" class="nav-btn" onclick="switchPage('recipePage')">Recipes</button>
      <button id="btn-pantryPage" class="nav-btn" onclick="switchPage('pantryPage')">Pantry</button>
    </div>

    <div id="brewPage" class="page active">
      <div class="card">
        <select id="activeRecipeDropdown" onchange="updateTimerSettings()"><option value="">Loading recipes...</option></select>
        <div class="timer-container">
          <div class="phase-name" id="phaseNameDisplay">Ready</div>
          <div class="phase-timer" id="phaseTimeDisplay">0:00</div>
          <div class="total-timer" id="totalTimeDisplay">Total: 0:00</div>
        </div>
        <div class="row">
          <button class="action-btn" id="startBtn" onclick="startTimer()">▶ Start</button>
          <button class="action-btn alt" onclick="stopTimer()">⏹ Stop</button>
        </div>
        <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
        <h3>Log Brew</h3>
        <select id="brewBeanDropdown"><option value="">Loading beans...</option></select>
        <select id="brewRating">
          <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
        </select>
        <button class="action-btn" onclick="logBrew()">Save to Feed</button>
        <p class="status" id="brewStatus"></p>
      </div>
    </div>

    <div id="feedPage" class="page"><div id="brewFeedContainer"></div></div>

    <div id="recipePage" class="page">
      <div class="card">
        <h2>New Recipe</h2>
        <input type="text" id="recipeName" placeholder="Recipe Name">
        <select id="recipeMethod"><option value="V60">V60</option><option value="AeroPress">AeroPress</option><option value="Inverted">Inverted</option></select>
        <input type="number" id="coffeeGrams" placeholder="Grams">
        <div class="row">
          <input type="number" id="s1" placeholder="P1(s)"><input type="number" id="s2" placeholder="P2(s)"><input type="number" id="s3" placeholder="P3(s)">
        </div>
        <button class="action-btn alt" onclick="saveRecipe()">Save</button>
        <p class="status" id="recipeStatus"></p>
      </div>
      <div id="recipeListContainer"></div>
    </div>

    <div id="pantryPage" class="page">
      <div class="card">
        <h2>Add Bean</h2>
        <input type="text" id="beanName" placeholder="Bean Name"><input type="text" id="roaster" placeholder="Roaster"><input type="date" id="roastDate">
        <button class="action-btn alt" onclick="sendBeanData()">Save</button>
        <p class="status" id="beanStatus"></p>
      </div>
      <div id="pantryListContainer"></div>
    </div>
  </div>

  <script>
    // ⚠️ CONFIGURATION
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3g5UCtZmWPFYoH_8TnxLGxmtEhumKBczSESJzwmGxeSjfUjeRD2bGBhLkKlL1T5mW/exec';
    const MASTER_PASSWORD = 'coffee-rocks'; 

    let currentUser = "";
    let allRecipes = [], allBeans = [];
    let endPhase1 = 0, endPhase2 = 0, endPhase3 = 0;
    let totalS = 0, timerInt = null;

    function checkLogin() {
      const u = document.getElementById('usernameInput').value;
      const p = document.getElementById('passwordInput').value;
      if (p === MASTER_PASSWORD && u.trim() !== "") {
        currentUser = u;
        localStorage.setItem('coffeeUser', u);
        localStorage.setItem('coffeePass', p);
        initApp();
      } else {
        document.getElementById('loginError').innerText = "Wrong password or name.";
      }
    }

    window.onload = function() {
      const u = localStorage.getItem('coffeeUser');
      const p = localStorage.getItem('coffeePass');
      if (u && p === MASTER_PASSWORD) { currentUser = u; initApp(); }
    };

    function initApp() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      refreshAllData();
    }

    function refreshAllData() {
      // Fetch Recipes
      fetch(`${SCRIPT_URL}?action=getRecipes&user=${currentUser}`).then(res => res.json()).then(data => {
        allRecipes = data.data;
        const d = document.getElementById('activeRecipeDropdown'); const l = document.getElementById('recipeListContainer');
        d.innerHTML = '<option value="">-- Choose Recipe --</option>'; l.innerHTML = '<h3 style="text-align:center;">Your Recipes</h3>';
        allRecipes.slice().reverse().forEach((row, i) => {
          d.innerHTML += `<option value="${allRecipes.length - 1 - i}">${row[1]}</option>`;
          l.innerHTML += `<div class="feed-card"><div class="feed-title">${row[1]}</div><div class="detail-text">${row[2]} | ${row[3]}g</div><div class="detail-text">${row[4]}s | ${row[5]}s | ${row[6]}s</div></div>`;
        });
      });

      // Fetch Beans
      fetch(`${SCRIPT_URL}?action=getBeans&user=${currentUser}`).then(res => res.json()).then(data => {
        allBeans = data.data;
        const bd = document.getElementById('brewBeanDropdown'); const bl = document.getElementById('pantryListContainer');
        bd.innerHTML = '<option value="">-- Choose Bean --</option>'; bl.innerHTML = '<h3 style="text-align:center;">Your Pantry</h3>';
        allBeans.slice().reverse().forEach(row => {
          bd.innerHTML += `<option value="${row[1]}">${row[1]}</option>`;
          bl.innerHTML += `<div class="feed-card"><div class="feed-title">${row[1]}</div><div class="detail-text">${row[2]}</div><div class="detail-text">Roasted: ${new Date(row[3]).toLocaleDateString()}</div></div>`;
        });
      });

      // Fetch Feed
      fetch(`${SCRIPT_URL}?action=getBrews&user=${currentUser}`).then(res => res.json()).then(data => {
        const fc = document.getElementById('brewFeedContainer');
        fc.innerHTML = '<h3 style="text-align:center;">Your Brew History</h3>';
        if (data.data.length === 0) { fc.innerHTML += '<p style="text-align:center;">No history.</p>'; return; }
        const tlWrap = document.createElement('div'); tlWrap.className = 'timeline';
        data.data.slice().reverse().forEach(row => {
          const dt = new Date(row[0]);
          tlWrap.innerHTML += `<div class="timeline-item"><div class="timeline-card"><div class="timeline-date">${dt.toLocaleDateString()} ${dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="feed-title">${row[2]}</div><div class="detail-text">☕ ${row[1]}</div><div class="detail-text">${"⭐".repeat(row[3])}</div></div></div>`;
        });
        fc.appendChild(tlWrap);
      });
    }

    function switchPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
      document.getElementById(id).classList.add('active');
      document.getElementById('btn-' + id).classList.add('active-btn');
    }

    function toggleHelp() {
      const m = document.getElementById('helpModal'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function updateTimerSettings() {
      const idx = document.getElementById('activeRecipeDropdown').value; if (idx === "") return;
      const r = allRecipes[idx]; const s1 = parseInt(r[4])||0; const s2 = parseInt(r[5])||0; const s3 = parseInt(r[6])||0;
      endPhase1 = s1; endPhase2 = s1+s2; endPhase3 = s1+s2+s3;
      document.getElementById('phaseNameDisplay').innerText = "Ready"; document.getElementById('phaseTimeDisplay').innerText = formatTime(s1);
    }

    function formatTime(s) { const m = Math.floor(s/60); const sc = s%60; return m+":"+(sc<10?"0":"")+sc; }

    function startTimer() {
      if (timerInt || endPhase1 === 0) return; document.getElementById('startBtn').disabled = true;
      timerInt = setInterval(() => {
        totalS++; document.getElementById('totalTimeDisplay').innerText = `Total: ${formatTime(totalS)}`;
        if (totalS <= endPhase1) { document.getElementById('phaseNameDisplay').innerText = "Phase 1"; document.getElementById('phaseTimeDisplay').innerText = formatTime(endPhase1-totalS); }
        else if (totalS <= endPhase2) { document.getElementById('phaseNameDisplay').innerText = "Phase 2"; document.getElementById('phaseTimeDisplay').innerText = formatTime(endPhase2-totalS); }
        else if (totalS <= endPhase3) { document.getElementById('phaseNameDisplay').innerText = "Phase 3"; document.getElementById('phaseTimeDisplay').innerText = formatTime(endPhase3-totalS); }
