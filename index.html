<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private Brew</title>
  <link rel="icon" href="https://fav.farm/🫘" />
  <style>
    /* ... Keep all your previous Helvetica, Timeline, and Card styles here ... */
    body { font-family: "Helvetica Neue", Helvetica, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #faf8f5; }
    h1 { text-align: center; color: #5c4033; font-weight: bold; }
    
    /* LOGIN SCREEN STYLES */
    #loginPage { position: fixed; top:0; left:0; width:100%; height:100%; background:#faf8f5; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 300px; }
    
    /* Rest of app UI... */
    .page { display: none; } .page.active { display: block; }
    .nav-bar { display: none; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; } /* Hidden until login */
    .nav-btn { flex: 1; padding: 10px; background: #e0d4c8; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btn.active-btn { background: #5c4033; color: white; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    input, select { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button.action-btn { width: 100%; padding: 15px; background: #5c4033; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    /* ... (Include previous timeline/feed styles) ... */
  </style>
</head>
<body>

  <div id="loginPage">
    <div class="login-card">
      <h2 style="text-align:center; color:#5c4033;">Welcome</h2>
      <input type="text" id="usernameInput" placeholder="Your Name">
      <input type="password" id="passwordInput" placeholder="Password">
      <button class="action-btn" onclick="checkLogin()">Enter Lab</button>
      <p id="loginError" style="color:red; font-size:12px; text-align:center;"></p>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <h1>My Private Brew</h1>
    <div class="nav-bar" id="appNav" style="display:flex;">
      <button id="btn-brewPage" class="nav-btn active-btn" onclick="switchPage('brewPage')">Brew</button>
      <button id="btn-feedPage" class="nav-btn" onclick="switchPage('feedPage')">Feed</button>
      <button id="btn-recipePage" class="nav-btn" onclick="switchPage('recipePage')">Recipes</button>
      <button id="btn-pantryPage" class="nav-btn" onclick="switchPage('pantryPage')">Pantry</button>
    </div>

    <div id="brewPage" class="page active">
      <div class="card">
        <select id="activeRecipeDropdown" onchange="updateTimerSettings()"><option value="">Loading...</option></select>
        <button class="action-btn" onclick="logBrew()">Save to Feed</button>
      </div>
    </div>
    
    </div>

  <script>
    const SCRIPT_URL = 'YOUR_WEB_APP_URL_GOES_HERE';
    const MASTER_PASSWORD = "coffee-rocks"; // 👈 Set your secret password here!

    let currentUser = "";

    function checkLogin() {
      const user = document.getElementById('usernameInput').value;
      const pass = document.getElementById('passwordInput').value;

      if (pass === MASTER_PASSWORD && user.trim() !== "") {
        currentUser = user;
        // Save to browser memory
        localStorage.setItem('coffeeUser', user);
        localStorage.setItem('coffeePass', pass);
        showApp();
      } else {
        document.getElementById('loginError').innerText = "Invalid user or password.";
      }
    }

    function showApp() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      loadUserData(); // Start fetching data for THIS user
    }

    window.onload = function() {
      // Check if they logged in recently
      const savedUser = localStorage.getItem('coffeeUser');
      const savedPass = localStorage.getItem('coffeePass');
      
      if (savedUser && savedPass === MASTER_PASSWORD) {
        currentUser = savedUser;
        showApp();
      }
    };

    function loadUserData() {
      // We append "&user=Name" to every GET request
      fetch(SCRIPT_URL + "?action=getRecipes&user=" + currentUser)
        .then(res => res.json())
        .then(data => { /* Render recipes... */ });
        
      // Repeat for Beans and Brews...
    }

    // In your POST functions (saveRecipe, logBrew, etc.), 
    // simply add: user: currentUser to the payload!
  </script>
</body>
</html>
