<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private Brew</title>
  <link rel="icon" href="https://fav.farm/🫘" />
  <style>
    body { font-family: "Helvetica Neue", Helvetica, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #faf8f5; color: #333; }
    h1 { text-align: center; color: #5c4033; font-weight: bold; margin-bottom: 20px; }
    #loginPage { position: fixed; top:0; left:0; width:100%; height:100%; background:#faf8f5; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 85%; max-width: 320px; text-align: center; }
    .nav-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
    .nav-btn { flex: 1; min-width: 80px; padding: 10px; background: #e0d4c8; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #5c4033; font-size: 14px; }
    .nav-btn.active-btn { background: #5c4033; color: white; }
    .page { display: none; } .page.active { display: block; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
    button.action-btn { width: 100%; padding: 15px; background: #5c4033; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .timer-container { background: #f9f6f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e0d4c8; text-align: center; }
    .phase-name { font-size: 18px; color: #e65100; font-weight: bold; text-transform: uppercase; }
    .phase-timer { font-size: 60px; font-weight: bold; color: #3e2723; }
    .total-timer { font-size: 14px; color: #888; font-weight: bold; }
    .timeline { border-left: 3px solid #e0d4c8; padding-left: 25px; margin-left: 15px; position: relative; }
    .timeline-item { position: relative; margin-bottom: 25px; }
    .timeline-item::before { content: ''; position: absolute; left: -34px; top: 0; width: 14px; height: 14px; background: #5c4033; border-radius: 50%; border: 3px solid #faf8f5; }
    .timeline-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .delete-btn { color: #d32f2f; background: none; border: 1px solid #ffcdd2; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; margin-top: 10px; float: right; }
    .step-input-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="loginPage">
    <div class="login-card">
      <h2>Coffee Lab Login</h2>
      <input type="text" id="usernameInput" placeholder="User Name">
      <input type="password" id="passwordInput" placeholder="Password">
      <button class="action-btn" onclick="checkLogin()">Enter</button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <h1>My Private Brew</h1>
    <div class="nav-bar">
      <button id="btn-brewPage" class="nav-btn active-btn" onclick="switchPage('brewPage')">Brew</button>
      <button id="btn-feedPage" class="nav-btn" onclick="switchPage('feedPage')">Feed</button>
      <button id="btn-recipePage" class="nav-btn" onclick="switchPage('recipePage')">Recipes</button>
      <button id="btn-pantryPage" class="nav-btn" onclick="switchPage('pantryPage')">Pantry</button>
    </div>

    <div id="brewPage" class="page active">
      <div class="card">
        <select id="activeRecipeDropdown" onchange="updateTimerSettings()"><option value="">Loading...</option></select>
        <div class="timer-container">
          <div class="phase-name" id="phaseNameDisplay">Ready</div>
          <div class="phase-timer" id="phaseTimeDisplay">0:00</div>
          <div class="total-timer" id="totalTimeDisplay">Total: 0:00 / 0:00</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="action-btn" id="startBtn" onclick="startTimer()">▶ Start</button>
          <button class="action-btn" style="background:#8d6e63;" onclick="stopTimer()">⏹ Stop</button>
        </div>
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <select id="brewBeanDropdown"><option value="">Loading beans...</option></select>
        <select id="brewRating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select>
        <button class="action-btn" onclick="logBrew()">Save Brew</button>
        <p class="status" id="brewStatus"></p>
      </div>
    </div>

    <div id="feedPage" class="page">
      <div id="brewFeedContainer"></div>
    </div>

    <div id="recipePage" class="page">
      <div class="card">
        <h2>New Recipe</h2>
        <input type="text" id="recipeName" placeholder="Name">
        <select id="recipeMethod">
          <option value="V60">V60</option>
          <option value="AeroPress">AeroPress</option>
          <option value="French Press">French Press</option>
          <option value="Moka Pot">Moka Pot</option>
          <option value="Chemex">Chemex</option>
          <option value="Clever Dripper">Clever Dripper</option>
        </select>
        <input type="number" id="coffeeGrams" placeholder="Coffee (g)">
        
        <label style="font-size:12px; font-weight:bold; color:#8d6e63;">NUMBER OF PHASES</label>
        <select id="numPhases" onchange="generateStepInputs()">
          <option value="2">2 Phases</option>
          <option value="3" selected>3 Phases</option>
          <option value="4">4 Phases</option>
          <option value="5">5 Phases</option>
        </select>

        <div id="stepInputsContainer"></div>
        <button class="action-btn" style="background:#8d6e63; margin-top:10px;" onclick="saveRecipe()">Save Recipe</button>
      </div>
      <div id="recipeListContainer"></div>
    </div>

    <div id="pantryPage" class="page">
      <div class="card">
        <input type="text" id="beanName" placeholder="Bean Name"><input type="text" id="roaster" placeholder="Roaster"><input type="date" id="roastDate">
        <button class="action-btn" style="background:#8d6e63;" onclick="sendBeanData()">Save Bean</button>
      </div>
      <div id="pantryListContainer"></div>
    </div>
  </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3g5UCtZmWPFYoH_8TnxLGxmtEhumKBczSESJzwmGxeSjfUjeRD2bGBhLkKlL1T5mW/exec'; 
    const MASTER_PASSWORD = 'coffee-rocks'; 

    let currentUser = "";
    let allRecipes = [], allBeans = [], phaseEndMarkers = [];
    let totalS = 0, timerInt = null, totalMaxTime = 0;

    // --- AUTH ---
    function checkLogin() {
      const u = document.getElementById('usernameInput').value;
      const p = document.getElementById('passwordInput').value;
      if (p === MASTER_PASSWORD && u.trim() !== "") {
        currentUser = u;
        localStorage.setItem('coffeeUser', u);
        localStorage.setItem('coffeePass', p);
        initApp();
      }
    }
    window.onload = function() {
      const u = localStorage.getItem('coffeeUser');
      const p = localStorage.getItem('coffeePass');
      if (u && p === MASTER_PASSWORD) { currentUser = u; initApp(); }
      generateStepInputs(); // Initialize step inputs on first load
    };
    function initApp() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      refreshAllData();
    }

    // --- DYNAMIC PHASE GENERATOR ---
    function generateStepInputs() {
      const num = parseInt(document.getElementById('numPhases').value);
      const container = document.getElementById('stepInputsContainer');
      container.innerHTML = '';
      for (let i = 1; i <= num; i++) {
        container.innerHTML += `
          <div class="step-input-row">
            <span style="font-size:12px; width:60px;">Phase ${i}</span>
            <input type="number" class="step-val" placeholder="Seconds" style="margin:5px 0;">
          </div>`;
      }
    }

    // --- DATA FETCHING ---
    function refreshAllData() {
      fetch(`${SCRIPT_URL}?action=getRecipes&user=${currentUser}`).then(res => res.json()).then(data => {
        allRecipes = data.data || [];
        const d = document.getElementById('activeRecipeDropdown');
        d.innerHTML = '<option value="">-- Select Recipe --</option>';
        allRecipes.forEach((row, i) => d.innerHTML += `<option value="${i}">${row[1]}</option>`);
      });
      fetch(`${SCRIPT_URL}?action=getBeans&user=${currentUser}`).then(res => res.json()).then(data => {
        allBeans = data.data || [];
        const bd = document.getElementById('brewBeanDropdown');
        bd.innerHTML = '<option value="">-- Select Bean --</option>';
        allBeans.forEach(row => bd.innerHTML += `<option value="${row[1]}">${row[1]}</option>`);
      });
      fetch(`${SCRIPT_URL}?action=getBrews&user=${currentUser}`).then(res => res.json()).then(data => renderFeed(data.data || []));
    }

    function renderFeed(brews) {
      const fc = document.getElementById('brewFeedContainer');
      fc.innerHTML = '<h3 style="text-align:center;">History</h3>';
      brews.slice().reverse().forEach(row => {
        const ts = row[0];
        fc.innerHTML += `
          <div class="timeline-item">
            <div class="timeline-card">
              <button class="delete-btn" onclick="deleteEntry('${ts}')">Delete</button>
              <div class="timeline-date">${new Date(ts).toLocaleString()}</div>
              <div style="font-weight:bold;">${row[2]}</div>
              <div style="font-size:13px; color:#666;">${row[1]} • ${"⭐".repeat(row[3])}</div>
            </div>
          </div>`;
      });
    }

    // --- TIMER LOGIC (Flexible Arrays) ---
    function updateTimerSettings() {
      const idx = document.getElementById('activeRecipeDropdown').value;
      if (idx === "") return;
      const r = allRecipes[idx];
      
      // We pull columns E through I (indexes 4 through 8)
      const steps = [r[4], r[5], r[6], r[7], r[8]].filter(s => s !== "" && s !== 0);
      
      phaseEndMarkers = [];
      let cumulative = 0;
      steps.forEach(s => {
        cumulative += parseInt(s);
        phaseEndMarkers.push(cumulative);
      });
      
      totalMaxTime = phaseEndMarkers[phaseEndMarkers.length - 1];
      document.getElementById('phaseNameDisplay').innerText = "Ready";
      document.getElementById('phaseTimeDisplay').innerText = formatTime(steps[0]);
      document.getElementById('totalTimeDisplay').innerText = `Total: 0:00 / ${formatTime(totalMaxTime)}`;
    }

    function startTimer() {
      if (timerInt || phaseEndMarkers.length === 0) return;
      document.getElementById('startBtn').disabled = true;
      timerInt = setInterval(() => {
        totalS++;
        document.getElementById('totalTimeDisplay').innerText = `Total: ${formatTime(totalS)} / ${formatTime(totalMaxTime)}`;
        
        // Find current phase
        let currentPhaseIdx = phaseEndMarkers.findIndex(m => totalS <= m);
        
        if (currentPhaseIdx !== -1) {
          document.getElementById('phaseNameDisplay').innerText = `Phase ${currentPhaseIdx + 1}`;
          document.getElementById('phaseTimeDisplay').innerText = formatTime(phaseEndMarkers[currentPhaseIdx] - totalS);
        } else {
          document.getElementById('phaseNameDisplay').innerText = "Finished";
          stopTimer();
        }
      }, 1000);
    }

    function formatTime(s) { const m = Math.floor(s/60); const sc = s%60; return m+":"+(sc<10?"0":"")+sc; }
    function stopTimer() { clearInterval(timerInt); timerInt = null; document.getElementById('startBtn').disabled = false; }

    // --- ACTIONS ---
    function saveRecipe() {
      const steps = Array.from(document.querySelectorAll('.step-val')).map(i => i.value);
      const payload = { 
        name: document.getElementById('recipeName').value, 
        method: document.getElementById('recipeMethod').value,
        grams: document.getElementById('coffeeGrams').value,
        steps: steps 
      };
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action:'addRecipe', user:currentUser, payload: payload}) }).then(() => refreshAllData());
    }

    function deleteEntry(ts) {
      if (!confirm("Delete this brew?")) return;
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action:'deleteBrew', user:currentUser, payload: {timestamp: ts}}) }).then(() => refreshAllData());
    }

    function logBrew() {
      const r = document.getElementById('activeRecipeDropdown');
      const payload = { beanName: document.getElementById('brewBeanDropdown').value, recipeName: r.options[r.selectedIndex].text, rating: document.getElementById('brewRating').value };
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action:'logBrew', user:currentUser, payload: payload}) }).then(() => refreshAllData());
    }
    
    function sendBeanData() {
      const payload = { beanName: document.getElementById('beanName').value, roaster: document.getElementById('roaster').value, roastDate: document.getElementById('roastDate').value };
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action:'addBean', user:currentUser, payload: payload}) }).then(() => refreshAllData());
    }
    function switchPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
      document.getElementById(id).classList.add('active');
      document.getElementById('btn-' + id).classList.add('active-btn');
    }
</script>
</body>
</html>
